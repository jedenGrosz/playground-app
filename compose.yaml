name: playground-app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    networks:
      - playground_app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - playground_app

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - playground_app

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-playground_app}"
      POSTGRES_USER: "${DB_USERNAME:-playground_app}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-playground_app}"
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-playground_app} -d ${DB_DATABASE:-playground_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - playground_app

networks:
  playground_app:
    driver: bridge

volumes:
  node_modules:
  postgres_data:
  vendor:
